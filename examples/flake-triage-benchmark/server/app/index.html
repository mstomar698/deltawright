<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fixture App — DW usefulness experiment</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; color: #111; }
    header { background: #1f2430; color: #fff; padding: 10px 16px; display: flex; gap: 14px; align-items: center; }
    header a { color: #cdd3df; text-decoration: none; font-size: 14px; }
    header a:hover { color: #fff; }
    main { padding: 20px; max-width: 820px; }
    h2 { margin: 0 0 14px; }
    label { display: block; margin: 8px 0 3px; font-size: 13px; color: #444; }
    input, button, select { font-size: 14px; padding: 7px 9px; }
    button { cursor: pointer; }
    button[disabled] { opacity: .5; cursor: not-allowed; }
    table { border-collapse: collapse; margin-top: 10px; width: 100%; }
    th, td { border: 1px solid #ddd; padding: 6px 9px; text-align: left; font-size: 13px; }
    th { background: #f4f6f9; cursor: pointer; }
    .ok { color: #0a7d43; font-weight: 600; }
    .err { color: #c0303a; font-weight: 600; }
    dialog { border: 1px solid #333; padding: 18px; }
    .glass { position: absolute; background: rgba(255,255,255,.02); z-index: 50; }
    .row-actions button { margin-right: 6px; }
    #status { min-height: 20px; color: #0a7d43; font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <strong>Fixture</strong>
    <a href="#/login">Login</a>
    <a href="#/dashboard">Dashboard</a>
    <a href="#/record">Record</a>
    <a href="#/modal">Modal</a>
    <a href="#/wizard">Wizard</a>
    <a href="#/settings">Settings</a>
  </header>
  <main id="root">loading…</main>
  <script src="/app.js"></script>
</body>
</html>
